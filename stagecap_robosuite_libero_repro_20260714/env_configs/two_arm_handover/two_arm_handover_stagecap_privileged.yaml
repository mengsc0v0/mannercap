env:
  _target_: capx.envs.tasks.franka.two_arm_handover.TwoArmHandoverCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: two_arm_handover_robosuite
    privileged: true
    clean_code_guard: true
    apis:
      - FrankaRobosuiteHandoverStageApi

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
output_dir: ./outputs/two_arm_handover_stagecap_privileged
trials: 100
num_workers: 2
use_oracle_code: false
use_stage_verifiable_runner: true
use_deterministic_stage_fast_paths: true
disable_privileged_data_generation_finalize: true
max_total_stage_attempts: 10
