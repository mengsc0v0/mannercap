env:
  _target_: capx.envs.tasks.franka.franka_cube_restack.FrankaRestackCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_cubes_restack_low_level
    privileged: true
    clean_code_guard: true
    prompt: |
      You are controlling a Franka Emika robot with the API described below.
      Goal: Restack the cubes by first moving the green cube off the red cube, then placing the red cube on top of the green cube and releasing it.
      Write ONLY executable Python code.
    apis:
      - FrankaRobosuiteRestackStageApi

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
output_dir: ./outputs/franka_robosuite_cube_restack_stagecap_privileged
trials: 100
num_workers: 4
use_oracle_code: false
use_stage_verifiable_runner: true
use_deterministic_stage_fast_paths: true
disable_privileged_data_generation_finalize: true
max_total_stage_attempts: 10
